name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许在 Actions 页面手动触发首次同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.2.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: lancecai2002/HMP-GNN
          # 默认 repo_type 是 'space'(会按 Gradio 应用构建,代码仓库会失败);
          # model 类型可承载任意文件,适合镜像研究代码
          repo_type: model
          hf_token: ${{ secrets.HF_TOKEN }}
