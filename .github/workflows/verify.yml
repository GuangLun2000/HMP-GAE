name: verify

# Training-free correctness gate. The author edits on a Mac (no GPU) and trains
# on Colab, so CI is the only place an automated pre-Colab signal exists.
# This job is intentionally zero-third-party-deps (no torch/transformers): it
# runs the stdlib doc/code guard and a whole-tree syntax smoke, so it is fast
# (~10s) and cannot flake across library versions.
# NOTE: the torch-dependent tests/test_trust_robustness.py is deliberately NOT
# run here yet — add a second job (pip install torch cpu wheel) once the test's
# version-sensitive single-round gate thresholds are settled, so the badge
# starts and stays green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Doc/code consistency guard (stdlib only)
        run: python check_docs.py
      - name: Syntax smoke over the whole tree (parse-only, no imports)
        run: python -m compileall -q .
